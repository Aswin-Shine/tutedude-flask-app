services:
  frontend:
    image: aswinshine/node-frontend:v1
    container_name: devops_node_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5001/api/submit
    depends_on:
      - backend
    networks:
      - devops_bridge_net

  backend:
    image: aswinshine/flask-backend:v1
    container_name: devops_flask_backend
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=${MONGO_URI}
    networks:
      - devops_bridge_net

networks:
  devops_bridge_net:
    driver: bridge